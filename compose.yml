name: gitrew-local
services:
  gitrew:
    build: .
    ports:
      - "127.0.0.1:9877:9877"
    volumes:
      - gitrew-state:/app/.celld
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9877/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  gitrew-state:
