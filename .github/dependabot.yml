version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep Node API declarations aligned with the Node 24 runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vue-tsc 3.3.13 requires the compiler API absent from TypeScript 7.
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
