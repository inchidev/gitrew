name: Check client

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:oauth
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Check mobile layout and navigation in WebKit
        run: npx playwright test tests/e2e/mobile.spec.ts --browser webkit --output test-results/webkit-mobile
      - run: npx playwright test -c playwright.backend.config.ts
      - name: Build Worker despite provider preset auto-detection
        run: npm run build:worker
        env:
          NITRO_PRESET: cloudflare_module
      - run: npx wrangler deploy --dry-run --outdir artifacts/worker-dry-run
      - name: Check public site boundaries
        run: npm run test:e2e:portal
      - name: Check static product site packaging
        run: npx wrangler deploy --config wrangler.portal.jsonc --dry-run --outdir artifacts/portal-dry-run
